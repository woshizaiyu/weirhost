name: Weirdhost 自动续期

on:
  schedule:
    # 每天北京时间 00:15 (UTC 16:15)
    - cron: '15 16 * * *'
  workflow_dispatch:

jobs:
  renew:
    runs-on: macos-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: 安装 Chrome (macOS 真 GPU)
        run: |
          brew install --cask google-chrome 2>/dev/null || true
          "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --version || true

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 启动家宽代理 (VLESS/SS -> 本地 Socks)
        env:
          VLESS_NODE: ${{ secrets.VLESS_NODE }}
          WEIRDHOST_PROXY: ${{ secrets.WEIRDHOST_PROXY }}
        run: |
          python scripts/vless_helper.py
          NEED_PROXY=$(grep -q "socks5://127.0.0.1" "$GITHUB_ENV" 2>/dev/null && echo yes || echo no)
          if [ "$NEED_PROXY" = "yes" ]; then
            echo "[proxy] 检测到 VLESS，安装 sing-box (macOS)..."
            SINGBOX_VER="1.11.3"
            UNAME=$(uname -m)
            if [ "$UNAME" = "arm64" ]; then ARCH="arm64"; else ARCH="amd64"; fi
            # macOS 用 darwin 包，Linux 用 linux 包（此 workflow 已切 macos）
            curl -fsSL -o /tmp/sing-box.tar.gz "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VER}/sing-box-${SINGBOX_VER}-darwin-${ARCH}.tar.gz"
            tar -xzf /tmp/sing-box.tar.gz -C /tmp
            sudo mv /tmp/sing-box-*/sing-box /usr/local/bin/sing-box
            sudo chmod +x /usr/local/bin/sing-box
            echo "[proxy] 启动 sing-box..."
            nohup sing-box run -c /tmp/singbox.json > /tmp/singbox.log 2>&1 &
            sleep 3
            head -n 50 /tmp/singbox.log || true
            for i in 1 2 3; do curl -x socks5h://127.0.0.1:10808 -I https://www.cloudflare.com/cdn-cgi/trace --connect-timeout 5 -m 10 && break || sleep 2; done
            curl -x socks5h://127.0.0.1:10808 https://www.cloudflare.com/cdn-cgi/trace --connect-timeout 5 -m 10 | head -n 10 || echo "[proxy] 代理探活失败，仍将直连重试（真 GPU 直连也可过盾，见技能）"
          else
            echo "[proxy] 未配置 VLESS，跳过（真 GPU 直连即可过盾）"
          fi

      - name: 运行续期脚本
        env:
          WEIRDHOST_COOKIE_1: ${{ secrets.WEIRDHOST_COOKIE_1 }}
          WEIRDHOST_COOKIE_2: ${{ secrets.WEIRDHOST_COOKIE_2 }}
          WEIRDHOST_COOKIE_3: ${{ secrets.WEIRDHOST_COOKIE_3 }}
          WEIRDHOST_COOKIE_4: ${{ secrets.WEIRDHOST_COOKIE_4 }}
          WEIRDHOST_COOKIE_5: ${{ secrets.WEIRDHOST_COOKIE_5 }}
          WEIRDHOST_ACCOUNTS: ${{ secrets.WEIRDHOST_ACCOUNTS }}
          ACCOUNTS: ${{ secrets.ACCOUNTS }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RENEW_THRESHOLD_DAYS: "2"
          WEIRDHOST_PROXY: ${{ secrets.WEIRDHOST_PROXY }}
          VLESS_NODE: ${{ secrets.VLESS_NODE }}
          HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
          HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
        run: |
          python scripts/weirdhost_renew.py

      - name: 上传调试截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: "*.png"
          retention-days: 3
          if-no-files-found: ignore

      - name: 清理旧工作流记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 7
          keep_minimum_runs: 3
